<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">URUBUNOIA</title>
  <desc id="d">Independent by nature. Curious by design.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#292B30"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#101113" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#101113" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#101113" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="#101113"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#292B30"/>

  <!-- amber accent bar -->
  <rect x="64" y="78" width="4" height="144" rx="2" fill="#F5A623"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">
    <text x="96" y="100" font-size="16" fill="#7D838B" letter-spacing="2">~/urubunoia</text>

    <text x="96" y="170" font-size="68" font-weight="700" fill="#E4E6E9"
          textLength="368" lengthAdjust="spacingAndGlyphs">URUBUNOIA</text>
    <!-- terminal cursor: slow, subtle blink -->
    <rect x="478" y="122" width="30" height="54" fill="#F5A623">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <text x="96" y="214" font-size="21" fill="#9AA0A8">Independent by nature. Curious by design.</text>

    <text x="1136" y="262" font-size="13" fill="#F5A623" letter-spacing="4" text-anchor="end">OBSERVE · LEARN · BUILD</text>
  </g>
</svg>
